name: Deploy to Production

# Manual-only, mirroring Dot.Mines' pipeline: trigger from the Actions tab
# (or `gh workflow run deploy.yml -f confirm=deploy`) when a release is
# ready. Requires the DEPLOY_* repository secrets set up at bootstrap.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: dopemine-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to dopemine.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo '::error::Confirmation input was not "deploy" -- aborting.'
          exit 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"

          echo "== Current release: $(git rev-parse --short HEAD)"

          git fetch origin main

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard origin/main
          composer install --no-interaction --optimize-autoloader --no-dev

          # Built frontend assets are COMMITTED in public/build -- no npm.
          $PHP artisan migrate --force

          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # Keep docroot asset links current (idempotent).
          for target in build images favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png robots.txt; do
            ln -sfn "dopemine/public/${target}" "$DOCROOT/${target}"
          done

          $PHP artisan up
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY
