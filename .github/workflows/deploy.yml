name: Deploy to Production

# Manual-only, mirroring Dot.Mines' pipeline: trigger from the Actions tab
# (or `gh workflow run deploy.yml -f confirm=deploy`) when a release is
# ready. Requires the DEPLOY_* repository secrets set up at bootstrap.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm deploying main to production'
        required: true

concurrency:
  group: dopemine-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to dopemine.infodot.co.za
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Refuse unconfirmed runs
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo '::error::Confirmation input was not "deploy" -- aborting.'
          exit 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}" \
              'bash -s' <<'DEPLOY'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          PHP=php
          DOCROOT="$(dirname "$DEPLOY_PATH")"

          echo "== Current release: $(git rev-parse --short HEAD)"

          git fetch origin main

          # Maintenance mode only for the risky window (migrations).
          $PHP artisan down --retry=30 || true

          git reset --hard origin/main
          composer install --no-interaction --optimize-autoloader --no-dev

          # Built frontend assets are COMMITTED in public/build -- no npm.
          $PHP artisan migrate --force

          $PHP artisan config:cache
          $PHP artisan route:cache
          $PHP artisan view:cache
          $PHP artisan event:cache

          # Keep docroot asset links current (idempotent).
          for target in build images favicon.ico favicon-16x16.png favicon-32x32.png apple-touch-icon.png robots.txt; do
            ln -sfn "dopemine/public/${target}" "$DOCROOT/${target}"
          done

          # ---- crontab: repair this app's lines, never touch anyone else's ----
          # Rule for this account: the crontab is written only by deploy
          # workflows, each touches only lines carrying its own marker, and a
          # write is verified before and after. 2026-08-31: a pipeline whose read
          # failed installed an EMPTY crontab and silently killed Dot.Mines'
          # scheduler for six weeks. cron runs with a minimal PATH, so lines carry
          # the absolute PHP path and keep their last output in a log file.
          MARK="# dot-dopemine"
          # One writer at a time on this account: deploys of different apps can
          # coincide and would otherwise race on the single crontab.
          exec 9>"$HOME/.dot-crontab.lock"; flock -w 120 9 || { echo "::error::could not take the crontab lock within 120 s"; exit 1; }
          PHP_BIN="$(command -v "${PHP:-php}")"
          OLD="$(mktemp)"; NEW="$(mktemp)"; ERR="$(mktemp)"
          if ! crontab -l > "$OLD" 2> "$ERR"; then
            if grep -qi "no crontab for" "$ERR"; then : > "$OLD"; else
              echo "::error::crontab -l failed: $(cat "$ERR"). Refusing to write a crontab I could not read."; exit 1
            fi
          fi
          OTHERS=$(grep -v "$MARK" "$OLD" | grep -c . || true)
          {
            grep -v "$MARK" "$OLD" || true
            echo "* * * * * cd $DEPLOY_PATH && $PHP_BIN artisan schedule:run > storage/logs/cron-scheduler.log 2>&1 $MARK"
          } > "$NEW"
          crontab "$NEW"
          AFTER=$(crontab -l | grep -v "$MARK" | grep -c . || true)
          MINE=$(crontab -l | grep -c "$MARK" || true)
          if [ "$AFTER" != "$OTHERS" ] || [ "$MINE" != "1" ]; then
            crontab "$OLD"
            echo "::error::crontab verification failed (other lines before=$OTHERS after=$AFTER, mine=$MINE); the previous crontab was restored."; exit 1
          fi
          rm -f "$OLD" "$NEW" "$ERR"; flock -u 9
          echo "== crontab: $MINE line(s) for $MARK installed, $OTHERS other line(s) preserved"

          $PHP artisan up
          echo "== Deployed: $(git rev-parse --short HEAD)"
          DEPLOY
